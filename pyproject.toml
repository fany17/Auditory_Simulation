[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auditory-simulation-m6a"
version = "0.1.0"
description = "Leakage-first gates for public audio-brain alignment"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.25,<5",
  "numpy>=2.4,<3",
  "scipy>=1.17,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
